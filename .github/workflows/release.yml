# Releases (task 051). A tag vX.Y.Z or vX.Y.Z-alpha.N builds the .deb and the
# installer ISO, publishes a GitHub Release and adds the .deb to the APT
# repository on GitHub Pages (pre-releases -> beta; releases -> stable and beta).
# Only tagged builds are published: there is no nightly channel, untested
# builds don't belong on a firewall.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo # one writer of the gh-pages branch at a time
  cancel-in-progress: false

jobs:
  build:
    # only the public repository publishes (the private dev repository has the
    # same workflow but no gh-pages branch or signing key)
    if: github.repository == 'MostlyWithinSpec/Goblin-Gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git describe needs the tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: version and channel
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" != tag ]; then
            echo "only tags are released" >&2
            exit 1
          fi
          V="${GITHUB_REF_NAME#v}"
          case "$V" in *-*) CH=beta ;; *) CH=stable ;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "channel=$CH" >> "$GITHUB_OUTPUT"
          echo "Building $V for the $CH channel"

      - name: web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: deb
        # goblind and the first-party plugins (same version: a plugin needs a
        # goblind at least as new as the one it was released with)
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="${{ steps.v.outputs.version }}" \
            -e GOFLAGS=-buildvcs=false golang:1.26-bookworm \
            bash -c "bash scripts/build-deb.sh && bash plugins/sentry/build-deb.sh dist"
          ls -l dist

      - name: installer ISO
        if: github.ref_type == 'tag'
        run: |
          docker run --rm --privileged -v "$PWD:/src" -e VERSION="${{ steps.v.outputs.version }}" \
            -e UNATTENDED=0 debian:12 bash /src/scripts/iso/build.sh
          ls -l dist

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$GITHUB_WORKSPACE/docs/releases/${TAG}.md" # absolute: the step cds into dist
          FLAGS=""
          case "$TAG" in *-*) FLAGS="--prerelease" ;; esac
          if [ -f "$NOTES" ]; then FLAGS="$FLAGS --notes-file $NOTES"; else FLAGS="$FLAGS --generate-notes"; fi
          # the build containers ran as root: take dist/ back before renaming
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          # GitHub renames "~" in asset names to "."; checksum files use the published names
          for f in *.deb; do
            n="${f//\~/.}"
            [ "$f" = "$n" ] || mv "$f" "$n"
            sha256sum "$n" > "$n.sha256"
          done
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Goblin Gate ${TAG#v}" $FLAGS
          gh release upload "$TAG" --clobber *.iso *.iso.sha256 *.deb *.deb.sha256

      - name: APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          git fetch origin gh-pages:gh-pages
          git worktree add pages gh-pages
          DEBS=$(echo dist/*.deb) # one line: it goes into a bash -c string
          run() { docker run --rm -v "$PWD:/w" -w /w -e APT_SIGNING_KEY debian:12 bash -c \
            "apt-get update -qq >/dev/null && apt-get install -y -qq apt-utils gnupg >/dev/null 2>&1 && bash scripts/apt-repo.sh pages/apt $1 $DEBS"; }
          run "$CHANNEL"
          [ "$CHANNEL" = stable ] && run beta # beta always carries the newest release too
          # bridge for boxes still on the old nightly suite: they get this release,
          # which moves them to beta (config.Load); drop after 0.1.0
          run nightly
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apt: ${{ steps.v.outputs.version }} -> $CHANNEL"
          git push origin gh-pages

  demo-image:
    # The demo as a container anyone can run on their own computer:
    #   docker run --rm -p 127.0.0.1:8090:8090 ghcr.io/mostlywithinspec/goblin-gate-demo
    # Free for public repositories. To publish it for an existing tag, run this
    # workflow by hand and pick the tag (Actions -> release -> Run workflow).
    if: github.repository == 'MostlyWithinSpec/Goblin-Gate' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/demo/Dockerfile
          platforms: linux/amd64,linux/arm64 # PCs, Apple Silicon Macs, Raspberry Pi
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ghcr.io/mostlywithinspec/goblin-gate-demo:${{ steps.v.outputs.version }}
            ghcr.io/mostlywithinspec/goblin-gate-demo:latest
