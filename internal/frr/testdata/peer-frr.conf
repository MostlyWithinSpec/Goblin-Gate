frr defaults traditional
hostname peer
log syslog informational
service integrated-vtysh-config
!
interface eth0
 ip ospf area 0.0.0.0
exit
!
interface ospfnet
 ip ospf area 0.0.0.0
 ip ospf passive
exit
!
router bgp 65002
 bgp router-id 10.99.0.3
 no bgp ebgp-requires-policy
 neighbor 10.99.0.2 remote-as 65001
 neighbor 10.99.0.2 password s3cret-pw
 neighbor fd99::2 remote-as 65001
 !
 address-family ipv4 unicast
  network 172.20.0.0/24
  network 172.21.0.0/24
 exit-address-family
 address-family ipv6 unicast
  network fd20::/64
  neighbor fd99::2 activate
 exit-address-family
exit
!
router ospf
 ospf router-id 10.99.0.3
exit
!
end
