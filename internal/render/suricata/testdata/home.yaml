%YAML 1.1
---
# Generated by Goblin Gate for IPS profile "home" - do not edit
vars:
  address-groups:
    HOME_NET: "[192.168.1.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544

# Inline on NFQUEUE (queues from /etc/suricata/goblin/home.env). fail-open accepts packets when
# Suricata falls behind; nft's queue bypass covers a stopped Suricata.
nfq:
  mode: accept
  fail-open: yes
host-mode: router
sensor-name: "goblin-home"

default-rule-path: /var/lib/suricata/goblin
rule-files:
  - home.rules
classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config
threshold-file: /etc/suricata/goblin/home.threshold

default-log-dir: /var/log/suricata/
logging:
  default-log-level: notice
  outputs:
    - file:
        enabled: yes
        level: info
        filename: /var/log/suricata/goblin-home.log
outputs:
  # Shared with the other profiles; read by goblind (internal/logs).
  - eve-log:
      enabled: yes
      filetype: regular
      filename: /var/log/suricata/eve.json
      types:
        - alert:
            tagged-packets: no
        - dns:
            requests: yes
            responses: no
        - tls
        - flow
unix-command:
  enabled: no
