# ulogd2 config for Goblin Gate (installed as /etc/ulogd.conf).
# Reads packets logged by policies (nft "log group 1 prefix GG:<id>:") and
# writes one JSON object per line to /var/log/ulog/goblin.json, which goblind
# ingests (internal/logs.ParseNftables). Needs packages ulogd2 and ulogd2-json.

[global]
logfile="syslog"
loglevel=3

plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_inppkt_NFLOG.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_raw2packet_BASE.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IFINDEX.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_filter_IP2STR.so"
plugin="/usr/lib/x86_64-linux-gnu/ulogd/ulogd_output_JSON.so"

stack=gg:NFLOG,base1:BASE,ifi1:IFINDEX,ip2str1:IP2STR,json1:JSON

[gg]
group=1

[json1]
file="/var/log/ulog/goblin.json"
sync=1
