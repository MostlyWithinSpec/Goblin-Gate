# simple-cdd configuration for the Goblin Gate installer (task 038).
# scripts/iso/build.sh sets local_packages and the output directory.
profiles="goblin"
auto_profiles="goblin"
debian_mirror="http://deb.debian.org/debian/"
security_mirror="http://deb.debian.org/debian-security/"
mirror_components="main non-free-firmware"
# keep the installer image small: no desktop, no extra tasks
export DISKTYPE=DVD
