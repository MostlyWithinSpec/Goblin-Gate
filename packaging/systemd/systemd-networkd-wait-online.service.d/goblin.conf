# Installed to /etc/systemd/system/systemd-networkd-wait-online.service.d/goblin.conf
#
# kea-dhcp4-server and unbound want network-online.target, so every restart the
# applier does re-runs wait-online while it is not yet satisfied. The stock
# setting waits up to 2 minutes for *every* link, and the WAN may never come up
# (no cable, ISP down). A router is online for its LAN once any link is.
# "-": a timeout (first boot before setup, WAN down) is not a failed unit;
# the services after network-online.target start either way.
[Service]
ExecStart=
ExecStart=-/lib/systemd/systemd-networkd-wait-online --any --timeout=20
