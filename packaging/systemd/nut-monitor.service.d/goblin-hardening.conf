# Goblin Gate: a lighter sandbox for the stock nut-monitor.service (upsmon).
# Its root half must still be able to power the box off (SHUTDOWNCMD), so the
# system stays writable where shutdown needs it and no capabilities or system
# calls are taken away; what is taken: home directories, other processes'
# view, kernel tunables and modules, new namespaces and exotic sockets.
[Service]
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
LockPersonality=yes
SystemCallArchitectures=native
