# Goblin Gate: sandbox for the stock ulogd2.service. ulogd opens the NFLOG
# netlink socket and its JSON log as root, then drops to the ulog user
# (--uid ulog) before reading packets; it needs CAP_NET_ADMIN for NFLOG and
# CAP_SETUID/CAP_SETGID to drop. It only writes its log and pid file.
[Service]
CapabilityBoundingSet=CAP_NET_ADMIN CAP_SETUID CAP_SETGID CAP_DAC_OVERRIDE CAP_CHOWN
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/log/ulog /run/ulog
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_NETLINK AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
