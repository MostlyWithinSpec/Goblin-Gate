# Goblin Gate: sandbox for the stock unbound.service. Unbound starts as root
# to bind port 53 and its control socket, then switches to the unbound user;
# the bounding set keeps only what that needs (CAP_CHOWN hands the control
# socket over, the rest raise limits). Writable: root.key (DNSSEC trust
# anchor updates) and /run/unbound (the control socket).
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETUID CAP_SETGID CAP_SYS_CHROOT CAP_CHOWN CAP_SYS_RESOURCE CAP_IPC_LOCK CAP_NET_RAW
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/unbound
RuntimeDirectory=unbound
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictAddressFamilies=AF_INET AF_INET6 AF_NETLINK AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
